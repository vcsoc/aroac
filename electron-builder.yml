appId: org.openamateurradio.oar
productName: OAR
asar: true
npmRebuild: false
directories:
  output: releases
files:
  - desktop/**
  - dist/**
  - shared/sources.json
  - shared/roadmap.js
  - LICENSE
  - roadmap.md
  - sources.yaml
  - data/cities.json
  - data/README.md
  - public/icon-512.png
  - package.json
  - "!node_modules/**"
publish:
  provider: github
  owner: vcsoc
  repo: oar
  releaseType: release
linux:
  syncDesktopName: true
  icon: public/icon-512.png
  category: Network
  target:
    - AppImage
    - tar.gz
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
win:
  icon: public/icon-512.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
